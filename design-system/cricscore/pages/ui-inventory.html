<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CricScore — UI map (simple)</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;background:#f4f5f7;color:#131316}
  header{position:sticky;top:0;z-index:10;background:#131316;color:#fff;padding:16px 20px}
  header h1{margin:0;font-size:17px;font-weight:900}
  header p{margin:4px 0 0;font-size:12px;color:#cbd5e1}
  header input{width:100%;margin-top:10px;font-size:17px;padding:12px;border-radius:10px;border:2px solid #333;background:#1e1e22;color:#fff}
  header input:focus{outline:2px solid #ffba08}
  #count{font-size:12px;color:#cbd5e1;margin:6px 0 0}
  .quick{max-width:1000px;margin:12px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
  .quick button{font-size:12px;font-weight:800;padding:8px 12px;border-radius:999px;border:1.5px solid #000;background:#fff;cursor:pointer}
  main{max-width:1000px;margin:0 auto;padding:12px 16px 40px}
  h2{font-size:13px;margin:20px 4px 8px;letter-spacing:1px;color:#475569}
  .row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:9px 12px;margin-bottom:6px}
  .dot{width:34px;height:34px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff;background:#64748b}
  .txt{flex:1;min-width:0}
  .txt b{font-size:13px;display:block}
  .txt code{font-size:11px;color:#0e7490}
  .txt span{font-size:11px;color:#64748b;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cp{flex:none;font-size:11px;font-weight:800;padding:8px 10px;border-radius:8px;border:1.5px solid #000;background:#fff;cursor:pointer}
  .hidden{display:none!important}
  footer{text-align:center;color:#64748b;font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
  <h1>CRICSCORE · UI MAP</h1>
  <p>Type to find anything. Tap COPY, paste the ID back to request a change. <b>?</b> + Enter = random element.</p>
  <input id="q" type="search" placeholder="Search… (try: wicket, four, hero, sheet, font, badge)" autocomplete="off">
  <p id="count"></p>
</header>
<div class="quick" id="quick"></div>
<main id="main"></main>
<footer>Paste an ID like <b>key.four</b> — e.g. “make <b>key.four</b> bigger”. Regenerate check: <code>tool/ui-inventory.sh</code></footer>
<script>
// name | id | where (file) | color key for the dot
const ITEMS = [
["GROUP","— SCREENS —","",""],
["Home","screen.home","home.dart","#1d4ed8"],
["Match setup","screen.setup","setup.dart","#1d4ed8"],
["Scoring (umpire)","screen.scoring","scoring.dart","#1d4ed8"],
["Scoreboard hero+strip","screen.scoreboard","scoreboard.dart","#1d4ed8"],
["Innings break","screen.break","break_result.dart","#1d4ed8"],
["Result + summary","screen.result","break_result.dart","#1d4ed8"],
["Archives","screen.history","history.dart","#64748b"],
["Club + players","screen.club","club.dart","#64748b"],
["Watch live (join)","screen.join","viewer.dart","#64748b"],
["GROUP","— KEYPAD (scoring.dart) —","",""],
["Key 0 (dot)","key.0","scoring.dart","#ffffff"],
["Key 1","key.1","scoring.dart","#ffffff"],
["Key 2","key.2","scoring.dart","#ffffff"],
["Key 3","key.3","scoring.dart","#ffffff"],
["Key 4 (four)","key.four","scoring.dart","#15803d"],
["Key 6 (six)","key.six","scoring.dart","#ec008c"],
["Key WD","key.wd","scoring.dart","#ffba08"],
["Key NB","key.nb","scoring.dart","#7b2cbf"],
["Key W (wicket)","key.w","scoring.dart","#dc143c"],
["UNDO button","key.undo","scoring.dart","#131316"],
["PLAYERS button","key.players","scoring.dart","#1d4ed8"],
["EXTRAS button","key.extras","scoring.dart","#64748b"],
["NB ARMED banner","state.nb","scoring.dart","#7b2cbf"],
["Break countdown + NEXT","state.break","scoring.dart","#131316"],
["GROUP","— HERO + STRIP —","",""],
["Hero score (big number)","hero.score","scoreboard.dart","#1d4ed8"],
["Hero meta (overs/crr/extras)","hero.meta","scoreboard.dart","#1d4ed8"],
["Target line","hero.target","scoreboard.dart","#1d4ed8"],
["Over strip (6 balls)","strip.row","scoreboard.dart","#ffffff"],
["Strip total (3r • 1w ›)","strip.total","scoreboard.dart","#ffffff"],
["Badge: 0 / 1 / 2 / 3","badge.runs","widgets.dart","#22d3ee"],
["Badge: 4","badge.four","widgets.dart","#15803d"],
["Badge: 6","badge.six","widgets.dart","#ec008c"],
["Badge: W / W+2","badge.wicket","widgets.dart","#dc143c"],
["Badge: WD / NB / B","badge.extra","widgets.dart","#ffba08"],
["Celebration style","fx.celebrate","widgets.dart","#ec008c"],
["GROUP","— SHEETS (popups) —","",""],
["Wicket dialog","sheet.wicket","sheets.dart","#dc143c"],
["Run-out picker","sheet.runout","sheets.dart","#dc143c"],
["Dismissal + next batter","sheet.dismissal","player_sheets.dart","#dc143c"],
["Bowler picker","sheet.bowler","player_sheets.dart","#1d4ed8"],
["Openers picker","sheet.openers","player_sheets.dart","#1d4ed8"],
["Player stats sheet","sheet.stats","player_sheets.dart","#1d4ed8"],
["Overs history","sheet.overs","sheets.dart","#64748b"],
["Extras (byes/wides)","sheet.extras","sheets.dart","#ffba08"],
["Mid-match settings","sheet.settings","sheets.dart","#64748b"],
["Look (style/font)","sheet.look","sheets.dart","#64748b"],
["GROUP","— CLUB + SUMMARY —","",""],
["Roster row","club.row","club.dart","#64748b"],
["Career profile","club.career","club.dart","#64748b"],
["Squad picker (setup)","club.squad","setup.dart","#64748b"],
["Scorecard tables","sum.scorecard","summary.dart","#1d4ed8"],
["Awards + POTM","sum.awards","summary.dart","#ec008c"],
["WhatsApp copy","sum.share","summary.dart","#15803d"],
["GROUP","— FONTS + THEMES —","",""],
["Font: Stadium (default)","font.stadium","theme.dart","#131316"],
["Font: Condensed","font.condensed","theme.dart","#131316"],
["Font: Block","font.block","theme.dart","#131316"],
["Font: Mono Ledger","font.ledger","theme.dart","#131316"],
["Font: Tech","font.tech","theme.dart","#131316"],
["Font: Tall","font.tall","theme.dart","#131316"],
["Font: Slab","font.slab","theme.dart","#131316"],
["Font: Wide","font.wide","theme.dart","#131316"],
["Font: Broadcast","font.broadcast","theme.dart","#131316"],
["Font: Ticket","font.ticket","theme.dart","#131316"],
["Theme: Umpire Pro","theme.umpire","theme.dart","#1d4ed8"],
["Theme: Solar","theme.solar","theme.dart","#f97316"],
["Theme: Pure White","theme.purewhite","theme.dart","#94a3b8"],
["Theme: Crimson","theme.crimson","theme.dart","#dc143c"],
["Theme: Nothing","theme.nothing","theme.dart","#64748b"],
["Theme: Game Boy","theme.gameboy","theme.dart","#65a30d"],
["Theme: Pro Red","theme.prored","theme.dart","#8b0000"],
["GROUP","— VIEWER + MISC —","",""],
["Viewer score","viewer.score","viewer.dart","#dc143c"],
["Staleness chip","viewer.stale","viewer.dart","#dc143c"],
["Share code chip","viewer.share","scoring.dart","#1d4ed8"],
["App-bar icons","nav.actions","screens","#1d4ed8"],
["Snackbar errors","state.error","screens","#dc143c"],
];
const main = document.getElementById('main');
const q = document.getElementById('q');
const count = document.getElementById('count');
let gid = 0;
const rows = [];
for(const [name,id,where,color] of ITEMS){
  if(name==="GROUP"){ const h=document.createElement('h2'); h.textContent=id.replace(/— /g,'').replace(/ —/g,''); h.dataset.group=id; main.appendChild(h); continue; }
  const d=document.createElement('div'); d.className='row';
  const initial = name.replace(/^Key /,'').trim().charAt(0).toUpperCase();
  d.innerHTML = '<div class="dot" style="background:'+color+';'+(color==='#ffffff'?'color:#000;border:1.5px solid #000':'')+'">'+initial+'</div>'
    +'<div class="txt"><b></b><code></code><span></span></div>'
    +'<button class="cp">COPY</button>';
  d.querySelector('b').textContent = name;
  d.querySelector('code').textContent = id;
  d.querySelector('span').textContent = where;
  const btn = d.querySelector('button');
  btn.onclick = ()=>{ navigator.clipboard.writeText(id).then(()=>{ btn.textContent='✓'; setTimeout(()=>btn.textContent='COPY',1000); }); };
  d.dataset.hay = (name+' '+id+' '+where).toLowerCase();
  main.appendChild(d); rows.push(d);
}
// quick filters for the most-changed things
const QUICK = ['four','wicket','hero','sheet','font','badge'];
const quick = document.getElementById('quick');
for(const k of QUICK){ const b=document.createElement('button'); b.textContent=k; b.onclick=()=>{ q.value=k; apply(); q.focus(); }; quick.appendChild(b); }
const rb=document.createElement('button'); rb.textContent='🎲 random'; rb.onclick=()=>{ q.value='?'; apply(); }; quick.appendChild(rb);
function apply(){
  const v = q.value.trim().toLowerCase();
  let n=0, first=null;
  // hide group headers with no visible rows (two-pass)
  const groups=[...main.querySelectorAll('h2')];
  groups.forEach(g=>g.classList.add('hidden'));
  let cur=null, curN=0;
  const all=[...main.children];
  for(const el of all){
    if(el.tagName==='H2'){ if(cur&&curN===0) cur.classList.add('hidden'); cur=el; curN=0; continue; }
    const show = !v || v==='?' || v==='random' ? true : el.dataset.hay.includes(v);
    el.classList.toggle('hidden',!show);
    if(show){ n++; curN++; if(!first) first=el; }
  }
  if(cur&&curN===0) cur.classList.add('hidden');
  count.textContent = v ? n+' match'+(n===1?'':'es') : rows.length+' items — type to filter';
  if((v==='?'||v==='random')){
    const vis=rows.filter(r=>!r.classList.contains('hidden'));
    if(vis.length) vis[Math.floor(Math.random()*vis.length)].scrollIntoView({behavior:'smooth',block:'center'});
  }
}
q.addEventListener('input',apply);
q.addEventListener('keydown',e=>{ if(e.key==='Enter') apply(); });
document.addEventListener('keydown',e=>{ if(e.key==='/'&&document.activeElement!==q){ e.preventDefault(); q.focus(); } });
apply();
</script>
</body>
</html>
