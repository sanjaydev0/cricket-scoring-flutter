name: cricket_scoring
description: Gully Cricket Scorer - 100% offline, sunlight-optimized Flutter port.
publish_to: 'none'
version: 2.24.5+76

environment:
  sdk: ^3.13.0

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# Flutter 3.47.7 pins these three transitives to exact older patches. The newer
# patches are additive only: material_color_utilities fixes a Cam16 hue
# calculation, test_api only adds exports, and cli_util's sole breaking change
# is a nullable sdkPath that flutter_launcher_icons never calls. Forcing them
# clears pub's "newer versions incompatible with dependency constraints" line.
# Remove this block if the next Flutter upgrade already ships these versions.
dependency_overrides:
  cli_util: ^0.6.0
  material_color_utilities: ^0.13.1
  test_api: ^0.7.15

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    - family: AntonCond
      fonts:
        - asset: assets/fonts/AntonCond.ttf
    - family: ArchivoBlack
      fonts:
        - asset: assets/fonts/ArchivoBlack.ttf
    - family: PlexMono
      fonts:
        - asset: assets/fonts/PlexMono.ttf
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch.ttf
    - family: BebasTall
      fonts:
        - asset: assets/fonts/BebasTall.ttf
    - family: AlfaSlab
      fonts:
        - asset: assets/fonts/AlfaSlab.ttf
    - family: Audiowide
      fonts:
        - asset: assets/fonts/Audiowide.ttf
    - family: BarlowCond
      fonts:
        - asset: assets/fonts/BarlowCond.ttf
    - family: Fjalla
      fonts:
        - asset: assets/fonts/Fjalla.ttf

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
  image_path: "assets/icon/cricscore_icon.png"
