name: cricket_scoring
description: Gully Cricket Scorer - 100% offline, sunlight-optimized Flutter port.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  audioplayers: ^6.7.1
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    - family: AntonCond
      fonts:
        - asset: assets/fonts/AntonCond.ttf
    - family: ArchivoBlack
      fonts:
        - asset: assets/fonts/ArchivoBlack.ttf
    - family: PlexMono
      fonts:
        - asset: assets/fonts/PlexMono.ttf
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch.ttf

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
  image_path: "assets/icon/cricscore_icon.png"
